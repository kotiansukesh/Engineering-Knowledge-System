name: Validate AI Vault

on:
  push:
    paths:
      - "AI/**"
      - ".github/workflows/validate-ai.yml"
  pull_request:
    paths:
      - "AI/**"
      - ".github/workflows/validate-ai.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python AI/scripts/validate-ai.py
