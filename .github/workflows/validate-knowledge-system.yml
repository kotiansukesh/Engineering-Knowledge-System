name: Validate Knowledge System

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Migrate Semantic Frontmatter"]
    types: [completed]
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Mermaid diagrams
        run: python3 scripts/validate-mermaid.py
      - name: Validate repository vault
        run: python3 scripts/validate-vault.py
      - name: Validate Coding Patterns
        run: python3 scripts/validate-coding-patterns.py
      - name: Validate Architect
        run: python3 scripts/validate-architect.py
      - name: Generate health report
        run: python3 scripts/validate-vault-health.py
