name: Validate Obsidian Vault

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate vault integrity
        run: python3 scripts/validate-vault.py
      - name: Generate vault health report
        run: python3 scripts/validate-vault-health.py
